<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BEM Safety Talk</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700&display=swap"
      rel="stylesheet">

<style>
:root {
  --blue: #083b94;
  --green: #219943;
  --border: #c9d4e3;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  background: #edf3fa;
  color: #17243b;
  font-family: "Noto Sans Thai", sans-serif;
}

button, input, select {
  font: inherit;
}

.app {
  width: min(100%, 960px);
  height: 100%;
  height: 100dvh;
  margin: auto;
  padding:
    max(8px, env(safe-area-inset-top))
    max(10px, env(safe-area-inset-right))
    max(8px, env(safe-area-inset-bottom))
    max(10px, env(safe-area-inset-left));
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  flex: 0 0 auto;
  padding: 3px 2px 8px;
}

h1 {
  margin: 0;
  color: var(--blue);
  font-size: 21px;
}

.hint {
  margin: 3px 0 0;
  color: #52637b;
  font-size: 12px;
}

.tabs {
  display: none;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 8px;
  flex: 0 0 auto;
}

.tab-button {
  min-height: 42px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #fff;
  color: var(--blue);
  font-weight: 700;
}

.tab-button.active {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}

.workspace {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
  gap: 12px;
  overflow: hidden;
}

.form-panel,
.preview-panel {
  min-width: 0;
  min-height: 0;
  background: #fff;
  border: 1px solid #e0e8f2;
  border-radius: 14px;
}

.form-panel {
  padding: 12px;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

h2 {
  margin: 0 0 6px;
  color: var(--blue);
  font-size: 17px;
}

.status {
  margin: 6px 0;
  color: var(--blue);
  font-size: 12px;
  line-height: 1.5;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 8px;
}

.field {
  min-width: 0;
}

label {
  display: block;
  margin: 9px 0 4px;
  font-size: 13px;
  font-weight: 700;
}

input, select {
  display: block;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  height: 44px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #fff;
  color: #17243b;
  font-size: 16px;
}

input[type="date"] {
  appearance: none;
  -webkit-appearance: none;
  padding: 7px 8px;
  overflow: hidden;
}

input[type="date"]::-webkit-date-and-time-value {
  min-width: 0;
  text-align: left;
}

.action-button,
.download-button {
  width: 100%;
  min-height: 46px;
  padding: 10px;
  border: 0;
  border-radius: 10px;
  color: #fff;
  font-weight: 700;
  cursor: pointer;
}

.action-button {
  margin-top: 13px;
  background: var(--blue);
}

.download-button {
  flex: 0 0 auto;
  background: var(--green);
}

button:disabled {
  opacity: .5;
  cursor: default;
}

.preview-panel {
  display: flex;
  flex-direction: column;
  padding: 8px;
  gap: 8px;
  overflow: hidden;
}

.preview-title {
  margin: 0;
  flex: 0 0 auto;
  color: var(--blue);
  font-size: 14px;
  font-weight: 700;
}

.preview-wrap {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: #f2f6fc;
  border-radius: 10px;
}

#preview {
  display: block;
  width: 100%;
  height: 100%;
  min-height: 0;
  object-fit: contain;
}

.empty-preview {
  padding: 15px;
  color: #52637b;
  text-align: center;
  font-size: 14px;
}

.save-hint {
  margin: 0;
  flex: 0 0 auto;
  color: #52637b;
  font-size: 11px;
  text-align: center;
}

[hidden] {
  display: none !important;
}

canvas {
  display: none;
}

@media (max-width: 700px) {
  h1 {
    font-size: 19px;
  }

  .hint {
    font-size: 11px;
  }

  .tabs {
    display: grid;
  }

  .workspace {
    display: block;
  }

  .form-panel,
  .preview-panel {
    display: none;
    width: 100%;
    height: 100%;
  }

  .workspace[data-active="form"] .form-panel {
    display: block;
  }

  .workspace[data-active="preview"] .preview-panel {
    display: flex;
  }
}
</style>
</head>

<body>
<div class="app">
  <header>
    <h1>BEM Safety Talk</h1>
    <p class="hint">กรอกข้อมูลและสร้างภาพ JPG — แม่แบบฝังในหน้าเว็บ</p>
  </header>

  <nav class="tabs" aria-label="เลือกหน้าจอ">
    <button id="formTab" class="tab-button active" type="button">
      กรอกข้อมูล
    </button>
    <button id="previewTab" class="tab-button" type="button">
      ตัวอย่างภาพ
    </button>
  </nav>

  <main id="workspace" class="workspace" data-active="form">
    <section class="form-panel">
      <h2>ข้อมูล Safety Talk</h2>

      <p id="status" class="status" role="status">
        กำลังโหลดแม่แบบ...
      </p>

      <div class="row">
        <div class="field">
          <label for="role">ตำแหน่ง</label>
          <select id="role">
            <option>หัวหน้าชุด</option>
            <option>รองหัวหน้าชุด</option>
            <option>แทนหัวหน้าชุด</option>
          </select>
        </div>

        <div class="field">
          <label for="route">สายทาง</label>
          <select id="route">
            <option value="SOE">SOE</option>
            <option value="SES">SES</option>
            <option value="C+">C+</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="shift">กะการทำงาน</label>
          <select id="shift">
            <option value="N8">กะดึก (N8)</option>
            <option value="M83">กะเช้า (M83)</option>
            <option value="M53">กะเช้า (M53)</option>
            <option value="E13">กะบ่าย (E13)</option>
          </select>
        </div>

        <div class="field">
          <label for="employeeName">ชื่อ-นามสกุล</label>
          <input id="employeeName" type="text"
                 placeholder="กรอกชื่อ-นามสกุล">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="employeeCode">รหัส</label>
          <input id="employeeCode" type="text"
                 placeholder="เช่น V421">
        </div>

        <div class="field">
          <label for="phone">เบอร์โทร</label>
          <input id="phone" type="tel" inputmode="tel"
                 placeholder="กรอกเบอร์โทร">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="vehicleCount">จำนวนรถ (คัน)</label>
          <input id="vehicleCount" type="number"
                 min="0" step="1" placeholder="กรอกจำนวน">
        </div>

        <div class="field">
          <label for="reportDate">วันที่ Safety Talk</label>
          <input id="reportDate" type="date">
        </div>
      </div>

      <label for="reportShift">กะที่แสดงแถวล่าง</label>
      <select id="reportShift">
        <option value="N8">N8</option>
        <option value="M83">M83</option>
        <option value="M53">M53</option>
        <option value="E13">E13</option>
      </select>

      <button id="generate" class="action-button"
              type="button" disabled>
        สร้างภาพตัวอย่าง
      </button>
    </section>

    <section class="preview-panel">
      <p class="preview-title">ตัวอย่างภาพ</p>

      <div class="preview-wrap">
        <div id="emptyPreview" class="empty-preview">
          กรอกข้อมูล<br>
          จากนั้นกด “สร้างภาพตัวอย่าง”
        </div>

        <img id="preview" alt="ภาพ Safety Talk" hidden>
      </div>

      <button id="download" class="download-button"
              type="button" disabled>
        ดาวน์โหลดภาพ JPG
      </button>

      <p class="save-hint">
        หากดาวน์โหลดไม่ได้ ให้กดค้างที่ภาพเพื่อบันทึก
      </p>
    </section>
  </main>
</div>

<canvas id="canvas"></canvas>

function setActiveTab(tab) {
  $('workspace').dataset.active = tab;

  $('formTab').classList.toggle(
    'active', tab === 'form'
  );

  $('previewTab').classList.toggle(
    'active', tab === 'preview'
  );
}

function loadBuiltInTemplate() {
  const value = TEMPLATE_BASE64.trim();

  template = null;
  $('generate').disabled = true;

  if (!value || value.includes('วาง_BASE64_ของคุณตรงนี้')) {
    $('status').textContent =
      'ยังไม่ได้ฝังแม่แบบ กรุณาวาง Base64 ในตัวแปร TEMPLATE_BASE64';
    return;
  }

  let source;

  if (/^data:/i.test(value)) {
    const commaIndex = value.indexOf(',');

    if (commaIndex === -1) {
      $('status').textContent = 'ข้อมูล Base64 ไม่ถูกต้อง';
      return;
    }

    const header = value
      .slice(0, commaIndex)
      .replace(/\s+/g, '');

    const payload = value
      .slice(commaIndex + 1)
      .replace(/\s+/g, '');

    source = `${header},${payload}`;
  } else {
    const payload = value.replace(/\s+/g, '');
    source = `data:${TEMPLATE_MIME};base64,${payload}`;
  }

  $('status').textContent = 'กำลังโหลดแม่แบบที่ฝังไว้...';

  const image = new Image();

  image.onload = () => {
    const ratio = image.naturalWidth / image.naturalHeight;
    const expectedRatio = REF_W / REF_H;

    if (Math.abs(ratio / expectedRatio - 1) > 0.01) {
      $('status').textContent =
        'แม่แบบต้องมีสัดส่วน 3:2 เช่น 1536 × 1024';
      return;
    }

    template = image;
    $('generate').disabled = false;

    $('status').textContent =
      'แม่แบบพร้อมใช้งาน — กรอกข้อมูลได้เลย';
  };

  image.onerror = () => {
    template = null;
    $('generate').disabled = true;

    $('status').textContent =
      'โหลดแม่แบบไม่สำเร็จ กรุณาตรวจสอบ Base64';
  };

  image.src = source;
}

function thaiDate(value) {
  if (!value) return '';

  const [year, month, day] = value.split('-').map(Number);
  const date = new Date(Date.UTC(year, month - 1, day));

  const formatter = new Intl.DateTimeFormat(
    'th-TH-u-ca-buddhist-nu-latn',
    {
      timeZone: 'UTC',
      weekday: 'long',
      day: 'numeric',
      month: 'long',
      year: 'numeric'
    }
  );

  const parts = {};

  formatter.formatToParts(date).forEach(part => {
    parts[part.type] = part.value;
  });

  return `${parts.weekday}ที่ ${parts.day} ${parts.month} ${parts.year}`;
}

function getReportData() {
  const name = $('employeeName').value.trim();

  const code = $('employeeCode').value
    .trim()
    .replace(/^\(|\)$/g, '');

  const phone = $('phone').value.trim();
  const count = $('vehicleCount').value.trim();
  const date = $('reportDate').value;

  if (!name || !code || !phone || !date) {
    throw new Error(
      'กรุณากรอกชื่อ-นามสกุล รหัส เบอร์โทร และวันที่ให้ครบ'
    );
  }

  if (
    count !== '' &&
    (!Number.isSafeInteger(Number(count)) || Number(count) < 0)
  ) {
    throw new Error(
      'จำนวนรถต้องเป็นจำนวนเต็มตั้งแต่ 0 ขึ้นไป'
    );
  }

  return {
    role: $('role').value,

    routeShift:
      `สายทาง ${$('route').value}  ${shiftLabels[$('shift').value]}`,

    nameCode: `${name} (${code})`,

    phone: `เบอร์โทร ${phone}`,

    count: count === '' ? '' : `จำนวน ${count} คัน`,

    date: thaiDate(date),

    reportShift: $('reportShift').value
  };
}

async function ensureFont(text) {
  if (!document.fonts || !document.fonts.load) {
    throw new Error(
      'กรุณาเปิดด้วย Safari หรือ Chrome รุ่นใหม่'
    );
  }

  const loadedFonts = await document.fonts.load(
    `700 40px ${FONT_FAMILY}`,
    text
  );

  if (loadedFonts.length === 0) {
    throw new Error(
      'โหลดฟอนต์ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่'
    );
  }
}

function drawTextInBox(text, box, scaleX = 1, scaleY = 1) {
  if (!text) return;

  text = String(text);

  const x = box.x * scaleX;
  const y = box.y * scaleY;
  const w = box.w * scaleX;
  const h = box.h * scaleY;
  const scale = Math.min(scaleX, scaleY);
  const padding = 4 * scale;

  ctx.save();

  ctx.direction = 'ltr';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';

  let fontSize = box.size * scale;
  const minFontSize = 8 * scale;

  let metrics;
  let left;
  let right;
  let ascent;
  let descent;

  while (true) {
    ctx.font = `normal 700 ${fontSize}px ${FONT_FAMILY}`;

    metrics = ctx.measureText(text);

    left = Number.isFinite(metrics.actualBoundingBoxLeft)
      ? metrics.actualBoundingBoxLeft
      : 0;

    right = Number.isFinite(metrics.actualBoundingBoxRight)
      ? metrics.actualBoundingBoxRight
      : metrics.width;

    ascent = Number.isFinite(metrics.actualBoundingBoxAscent)
      ? metrics.actualBoundingBoxAscent
      : fontSize * 0.8;

    descent = Number.isFinite(metrics.actualBoundingBoxDescent)
      ? metrics.actualBoundingBoxDescent
      : fontSize * 0.2;

    const textWidth = Math.max(
      metrics.width,
      left + right
    );

    const textHeight = ascent + descent;

    if (
      (
        textWidth <= w - padding * 2 &&
        textHeight <= h - padding * 2
      ) ||
      fontSize <= minFontSize
    ) {
      break;
    }

    fontSize = Math.max(
      minFontSize,
      fontSize - 0.5 * scale
    );
  }

  const drawX =
    x + (w - (left + right)) / 2 + left;

  const drawY =
    y + (h - (ascent + descent)) / 2 + ascent;

  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();

  ctx.fillStyle = box.color || '#111111';
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;

  ctx.fillText(text, drawX, drawY);

  ctx.restore();
}

function drawReport(data) {
  if (!template) {
    throw new Error('แม่แบบยังไม่พร้อมใช้งาน');
  }

  canvas.width = REF_W;
  canvas.height = REF_H;

  ctx.clearRect(0, 0, REF_W, REF_H);
  ctx.drawImage(template, 0, 0, REF_W, REF_H);

  Object.keys(boxes).forEach(key => {
    drawTextInBox(data[key], boxes[key], 1, 1);
  });
}

function canvasToJpg() {
  return new Promise((resolve, reject) => {
    canvas.toBlob(
      blob => {
        if (blob) {
          resolve(blob);
        } else {
          reject(new Error('สร้างไฟล์ภาพไม่สำเร็จ'));
        }
      },
      'image/jpeg',
      0.95
    );
  });
}

async function generateReport() {
  if (busy || !template) return;

  busy = true;
  $('generate').disabled = true;
  $('download').disabled = true;

  $('status').textContent =
    'กำลังโหลดฟอนต์และสร้างภาพ...';

  try {
    const data = getReportData();
    const dateValue = $('reportDate').value;

    await ensureFont(
      Object.values(data).join(' ')
    );

    drawReport(data);

    const blob = await canvasToJpg();
    const nextURL = URL.createObjectURL(blob);
    const previousURL = previewURL;

    imageBlob = blob;
    imageFilename = `BEM_SafetyTalk_${dateValue}.jpg`;
    previewURL = nextURL;

    $('preview').src = previewURL;
    $('preview').hidden = false;
    $('emptyPreview').hidden = true;
    $('download').disabled = false;

    if (previousURL) {
      URL.revokeObjectURL(previousURL);
    }

    $('status').textContent =
      'สร้างภาพสำเร็จ — ตรวจสอบได้ที่ตัวอย่างภาพ';

    if (window.matchMedia('(max-width: 700px)').matches) {
      if (
        document.activeElement &&
        typeof document.activeElement.blur === 'function'
      ) {
        document.activeElement.blur();
      }

      setActiveTab('preview');
    }
  } catch (error) {
    $('status').textContent =
      `สร้างภาพไม่สำเร็จ: ${error.message}`;

    $('download').disabled = !imageBlob;
  } finally {
    busy = false;
    $('generate').disabled = !template;
  }
}

async function downloadImage() {
  if (!imageBlob || !previewURL) return;

  if (
    typeof File !== 'undefined' &&
    navigator.canShare &&
    navigator.share
  ) {
    const file = new File(
      [imageBlob],
      imageFilename,
      { type: 'image/jpeg' }
    );

    if (navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          files: [file]
        });
        return;
      } catch (error) {
        if (error.name === 'AbortError') return;
      }
    }
  }

  const link = document.createElement('a');

  link.href = previewURL;
  link.download = imageFilename;

  document.body.appendChild(link);
  link.click();
  link.remove();
}

$('formTab').addEventListener('click', () => {
  setActiveTab('form');
});

$('previewTab').addEventListener('click', () => {
  setActiveTab('preview');
});

$('shift').addEventListener('change', () => {
  $('reportShift').value = $('shift').value;
});

$('generate').addEventListener(
  'click',
  generateReport
);

$('download').addEventListener(
  'click',
  downloadImage
);

// ตั้งค่าวันที่เริ่มต้นเป็น "วันที่ปัจจุบัน" อัตโนมัติ
const today = new Date();
const year = today.getFullYear();
const month = String(today.getMonth() + 1).padStart(2, '0');
const day = String(today.getDate()).padStart(2, '0');
$('reportDate').value = `${year}-${month}-${day}`;

// โหลดแม่แบบฝังทันทีเมื่อเปิดหน้าเว็บ
loadBuiltInTemplate();
</script>
